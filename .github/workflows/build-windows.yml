name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - claude/snagit-screen-capture-tool-08kvjr
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write # needed to attach installers to the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer + portable exe
        run: npm run dist:win
        env:
          # No code-signing certificate; ship unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenSnag-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

      - name: Attach installers to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

      - name: Publish installers to the rolling "latest" release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: OpenSnag — latest Windows build
          body: |
            Automated Windows build of the newest commit.
            - **OpenSnag Setup *x*.*x*.*x*.exe** — installer (recommended)
            - **OpenSnag *x*.*x*.*x*.exe** — portable, no install needed
          prerelease: true
          files: dist/*.exe
