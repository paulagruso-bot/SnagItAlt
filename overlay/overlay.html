<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; cursor: crosshair; user-select: none;
    background: #000;
  }
  #shot {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #veil {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  #hint {
    position: absolute;
    top: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(20, 20, 26, 0.88);
    color: #eceef2;
    font: 13px/1.5 system-ui, sans-serif;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    pointer-events: none;
    z-index: 5;
  }
  #hint kbd {
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
  }
  #dims {
    position: absolute;
    background: #e91e63;
    color: #fff;
    font: 12px/1 system-ui, sans-serif;
    padding: 4px 8px;
    border-radius: 4px;
    display: none;
    pointer-events: none;
    z-index: 5;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <img id="shot" alt="" />
  <canvas id="veil"></canvas>
  <div id="hint">Drag to select a region &nbsp;·&nbsp; <kbd>Enter</kbd> full screen &nbsp;·&nbsp; <kbd>Esc</kbd> cancel</div>
  <div id="dims"></div>
  <script src="overlay.js"></script>
</body>
</html>
